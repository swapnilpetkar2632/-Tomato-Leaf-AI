{% extends "base.html" %}
{% block title %}Forgot password · Tomato Leaf AI{% endblock %}
{% block content %}
<div class="min-h-[calc(100vh-180px)] bg-leaf-50 px-4 py-10 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-lg rounded-3xl bg-white p-6 shadow-xl sm:p-10">
        <div class="mb-8 text-center">
            <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-leaf-100 text-3xl" aria-hidden="true">🔐</div>
            <h1 class="text-3xl font-extrabold text-slate-900">Reset your password</h1>
            <p class="mt-3 text-sm leading-6 text-slate-600">Enter your email and we will prepare a reset link for local development.</p>
        </div>
        {% if message %}<div class="mb-5 rounded-xl border border-leaf-200 bg-leaf-50 px-4 py-3 text-sm text-leaf-800" aria-live="polite">{{ message }}</div>{% endif %}
        <form method="post" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label for="email" class="mb-2 block text-sm font-semibold text-slate-700">Email</label>
                <input id="email" name="email" type="email" autocomplete="username" required class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-leaf-500 focus:ring-2 focus:ring-leaf-200">
            </div>
            <button type="submit" class="w-full rounded-xl bg-leaf-500 px-4 py-3.5 font-bold text-white hover:bg-leaf-600">Request reset link</button>
        </form>
        <p class="mt-8 text-center text-sm"><a href="{{ url_for('auth.login') }}" class="font-bold text-leaf-700 hover:underline">Back to login</a></p>
    </div>
</div>
{% endblock %}
