{% extends "base.html" %}
{% block title %}{{ title }} · Tomato Leaf AI{% endblock %}
{% block content %}
<div class="mx-auto flex min-h-[55vh] max-w-2xl items-center justify-center px-4 py-16 text-center sm:px-6 lg:px-8"><div><span class="mx-auto flex h-16 w-16 items-center justify-center rounded-3xl bg-leaf-100 font-display text-3xl font-bold text-leaf-700" aria-hidden="true">!</span><h1 class="mt-6 font-display text-3xl font-bold text-leaf-900">{{ title }}</h1><p class="mx-auto mt-3 max-w-md leading-7 text-slate-600">{{ message }}</p><a href="{{ url_for('index') if current_user.is_authenticated else url_for('auth.login') }}" class="mt-7 inline-flex rounded-xl bg-leaf-700 px-5 py-3 font-extrabold text-white hover:bg-leaf-900">Return to Home</a></div></div>
{% endblock %}
