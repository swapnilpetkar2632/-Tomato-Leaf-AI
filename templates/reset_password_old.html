{% extends "base.html" %}
{% block title %}Set new password · Tomato Leaf AI{% endblock %}
{% block content %}
<div class="min-h-[calc(100vh-180px)] bg-leaf-50 px-4 py-10 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-lg rounded-3xl bg-white p-6 shadow-xl sm:p-10">
        <h1 class="text-3xl font-extrabold text-slate-900">Set a new password</h1>
        <p class="mt-3 text-sm text-slate-600">Choose a password with at least 8 characters.</p>
        <form method="post" class="mt-8 space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label for="password" class="mb-2 block text-sm font-semibold text-slate-700">New password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" required class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-leaf-500 focus:ring-2 focus:ring-leaf-200">
            </div>
            <div>
                <label for="confirm_password" class="mb-2 block text-sm font-semibold text-slate-700">Confirm password</label>
                <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-leaf-500 focus:ring-2 focus:ring-leaf-200">
            </div>
            <button type="submit" class="w-full rounded-xl bg-leaf-500 px-4 py-3.5 font-bold text-white hover:bg-leaf-600">Save new password</button>
        </form>
    </div>
</div>
{% endblock %}
